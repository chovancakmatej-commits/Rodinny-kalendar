name: Kalendár

# Every 15 minutes: download the calendars, encrypt them and publish the app with fresh data
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stiahnuť kalendáre
        env:
          CALENDARS: ${{ secrets.CALENDARS }}
          CALENDAR_PASSWORD: ${{ secrets.CALENDAR_PASSWORD }}
        run: node scripts/build-calendar.mjs
      - name: Pripraviť stránku
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js icon-*.png _site/
          if [ -f data.enc.json ]; then cp data.enc.json _site/; fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      # GitHub sometimes does not see the just-uploaded artifact yet ("No artifacts named github-pages"),
      # so wait a moment and try again instead of failing the whole run
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 20
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 45
      - id: deploy
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
