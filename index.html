<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#11171d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>html,body{margin:0;height:100dvh;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}body{font-family:system-ui,sans-serif}</style>
<title>Rodinný kalendár</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: landscape kiosk. Left = header strip, big month grid, today's events row underneath. Right = to-do list column. Full-screen slideshow overlay on idle */
:root {
  --bg: #eef1f3;
  --panel: #ffffff;
  --ink: #18222c;
  --muted: #5f6c78;
  --line: #dde2e7;
  --now: #e2463a;
  --today: #18222c;
  --today-ink: #ffffff;
  --p-work: #3d6fb6;
  --p-me: #1d8a78;
  --p-wife: #a2477e;
  --p-fam: #c58410;
  --hl-bg: #fff4e0;
  --hl-ink: #6b4300;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171d; --panel: #1a222a; --ink: #e8edf1; --muted: #93a1ad; --line: #2b3640; --now: #ff6b5e; --today: #e8edf1; --today-ink: #11171d;
  --p-work: #6f9ae0; --p-me: #3fbca6; --p-wife: #d277ac; --p-fam: #e3a83a; --hl-bg: #33280f; --hl-ink: #ffd892; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11171d; --panel: #1a222a; --ink: #e8edf1; --muted: #93a1ad; --line: #2b3640; --now: #ff6b5e; --today: #e8edf1; --today-ink: #11171d;
  --p-work: #6f9ae0; --p-me: #3fbca6; --p-wife: #d277ac; --p-fam: #e3a83a; --hl-bg: #33280f; --hl-ink: #ffd892; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; }
.app {
  height: 100%; overflow: hidden; box-sizing: border-box;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 22vw); grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px;
  grid-template-areas: "head todo" "cal todo" "day todo";
}
.panel { background: var(--panel); border-radius: 14px; padding: 12px 16px; border: 1px solid var(--line); min-width: 0; }
h2 { font-family: var(--display); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; }
.tnum { font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; display: inline-block; }

/* Header strip */
.head { grid-area: head; display: flex; align-items: center; gap: 12px 24px; }
.head > div:not(.clock) { min-width: 0; }
.clock { font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 7vh, 3.6rem); line-height: 1; letter-spacing: -0.02em; }
.date { font-size: 1.15rem; font-weight: 600; text-transform: capitalize; }
.weather { color: var(--muted); font-size: .95rem; margin-top: 2px; }
.next { margin-left: auto; background: var(--hl-bg); color: var(--hl-ink); border-radius: 12px; padding: 8px 16px; display: flex; align-items: center; gap: 14px; min-width: 0; max-width: 100%; flex-shrink: 1; }
.next > div:last-child { min-width: 0; }
.next .what, .next .meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.next .count { font-family: var(--display); font-weight: 700; font-size: 1.5rem; white-space: nowrap; }
.next .what { font-weight: 600; font-size: 1.05rem; }
.next .meta { font-size: .85rem; opacity: .85; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Month grid */
.cal { grid-area: cal; display: flex; flex-direction: column; min-height: 0; }
.calhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.calhead .m { font-family: var(--display); font-weight: 700; font-size: 1.5rem; text-transform: capitalize; }
.grid-wrap { overflow: hidden; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.wk, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.wk div { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 4px 8px; }
.grid { flex: 1; min-height: 0; grid-auto-rows: minmax(0, 1fr); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.cell { border-style: solid; border-width: 0 1px 1px 0; border-color: var(--line); border-radius: 0; padding: 4px 6px 3px; min-width: 0; min-height: 0; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; gap: 3px; background: none; font: inherit; color: inherit; text-align: left; }
.cell:focus-visible { outline: 3px solid var(--p-work); outline-offset: -3px; }
.cell.out { color: var(--muted); background: color-mix(in srgb, var(--ink) 3%, transparent); }
.cell.out .ln { opacity: .5; }
.cell.we .n { color: var(--muted); }
.cell .n { font-family: var(--display); font-weight: 700; font-size: 1rem; width: 26px; height: 26px; flex: none; display: grid; place-items: center; border-radius: 50%; }
.cell.today { background: color-mix(in srgb, var(--p-fam) 10%, transparent); box-shadow: inset 0 0 0 2px var(--today); }
.cell.today .n { background: var(--today); color: var(--today-ink); }
.cell.sel:not(.today) { box-shadow: inset 0 0 0 2px var(--p-work); }
.cell .ln + .ln { margin-top: 2px; }
.cell { gap: 5px; padding: 8px 8px 6px; }
.cell .n { font-size: 1.3rem; width: 38px; height: 38px; }
.ln { flex: none; font-size: .86rem; line-height: 1.3; padding: 3px 6px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; border-radius: 5px; padding: 1px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: color-mix(in srgb, var(--c) 16%, transparent); border-left: 3px solid var(--c); }
.ln.imp { font-weight: 700; }
.cell .ln { white-space: normal; }
.more { font-size: .75rem; color: var(--muted); padding-left: 5px; }

/* Day events row */
.day { grid-area: day; }
.dayhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.evrow { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.ev { flex: 0 0 auto; width: 180px; border-radius: 10px; padding: 7px 11px; box-sizing: border-box;
  background: color-mix(in srgb, var(--c) 13%, var(--panel)); border-top: 4px solid var(--c); }
.ev .tm { font-weight: 600; font-size: .9rem; }
.ev .tt { font-weight: 600; font-size: 1.02rem; margin-top: 2px; }
.ev .who { font-size: .8rem; color: var(--muted); margin-top: 2px; }
.ev.past { opacity: .45; }
.ev.nextup { box-shadow: 0 0 0 3px var(--now); }
.ev .badge { display: inline-block; font-size: .72rem; font-weight: 700; color: var(--now); text-transform: uppercase; letter-spacing: .05em; }
.empty { color: var(--muted); padding: 8px 0; }

/* To-do */
.todo { grid-area: todo; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.todo .tasks { flex: 1; min-height: 0; overflow-y: auto; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.tabs span { font-size: .82rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tabs span.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.tasks label { display: flex; gap: 12px; align-items: center; padding: 11px 6px; border-radius: 10px; cursor: pointer; font-size: 1.05rem; }
.tasks label:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.tasks input { width: 24px; height: 24px; accent-color: var(--p-me); flex: none; }
.tasks input:focus-visible { outline: 3px solid var(--p-work); outline-offset: 2px; }
.tasks .t { min-width: 0; }
.tasks input:checked + .t { text-decoration: line-through; color: var(--muted); }
.tasks .who { display: block; font-size: .8rem; color: var(--muted); }
.tasks .due { color: var(--now); font-weight: 700; font-size: .78rem; margin-left: 6px; }
.addrow { display: flex; gap: 8px; margin-top: 10px; }
.addrow input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.addrow button, button.ss { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
.addrow button:focus-visible, button.ss:focus-visible, .addrow input:focus-visible { outline: 3px solid var(--p-work); outline-offset: 2px; }
.foot { padding-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); }
.foot .note { flex-basis: 100%; }

/* Slideshow */
.show { position: fixed; inset: 0; z-index: 50; background: #000; cursor: pointer; overflow: hidden; }
.slide { position: absolute; inset: -4%; opacity: 0; transition: opacity 1.6s ease; background-size: cover; }
.slide.on { opacity: 1; animation: kb 12s linear forwards; }
@keyframes kb { from { transform: scale(1); } to { transform: scale(1.08) translate(-1%, -1%); } }
.show .ov { position: absolute; left: 0; right: 0; bottom: 0; padding: 28px max(28px, env(safe-area-inset-left, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
  display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; color: #fff;
  background: linear-gradient(transparent, rgba(0,0,0,.55)); }
.show .bigclock { font-family: var(--display); font-weight: 700; font-size: clamp(3rem, 9vw, 6rem); line-height: 1; text-shadow: 0 2px 20px rgba(0,0,0,.4); }
.show .pill { background: rgba(255,255,255,.18); backdrop-filter: blur(8px); border-radius: 14px; padding: 10px 16px; font-size: 1.05rem; max-width: 100%; }
.show .cap { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); color: rgba(255,255,255,.75); font-size: .85rem; }
.ssmonth { position: absolute; top: calc(48px + env(safe-area-inset-top, 0px)); right: max(28px, env(safe-area-inset-right, 0px)); width: min(340px, 80vw);
  background: rgba(10,14,20,.45); backdrop-filter: blur(10px); border-radius: 18px; padding: 16px 18px; color: #fff; }
.ssmonth .mt { font-family: var(--display); font-weight: 700; font-size: 1.2rem; text-transform: capitalize; margin-bottom: 8px; }
.ssmonth .mg { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-variant-numeric: tabular-nums; }
.ssmonth .mg span { padding: 5px 0 7px; position: relative; font-size: .95rem; border-radius: 50%; }
.ssmonth .mg .h { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; opacity: .7; }
.ssmonth .mg .o { opacity: .35; }
.ssmonth .mg .td { background: #fff; color: #111; font-weight: 700; }
.ssmonth .mg .has::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: #ffc56b; }
.ssmonth .mg .td.has::after { background: #c58410; }
@media (max-height: 500px) { .ssmonth { display: none; } }
@media (prefers-reduced-motion: reduce) { .slide.on { animation: none; } .slide { transition: none; } }

@media (max-height: 680px) and (min-width: 821px) {
  .weather { display: none; }
  .ev .who { display: none; }
  .tabs { display: none; }
}
@media (max-width: 820px) {
  .head { flex-wrap: wrap; }
  .app { height: auto; min-height: 100%; overflow: visible; grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-template-areas: "head" "cal" "day" "todo"; }
  .cal { min-height: 480px; }
  .todo { overflow: visible; }
  .next { margin-left: 0; }
}
</style>
</head>
<body>

<div class="app">
  <section class="panel head" aria-label="Teraz">
    <div class="clock tnum" id="clock">--:--</div>
    <div>
      <div class="date" id="date"></div>
      <div class="weather tnum">11° polooblačno · popoludní dážď 60 %</div>
    </div>
    <div class="next" aria-live="polite">
      <div class="count tnum" id="nextCount"></div>
      <div><div class="what" id="nextWhat"></div><div class="meta" id="nextMeta"></div></div>
    </div>
  </section>

  <section class="panel cal" aria-label="Mesačný kalendár">
    <div class="calhead">
      <div class="m" id="month"></div>
      <div class="legend">
        <span><i class="dot" style="--c:var(--p-work)"></i>Mato práca</span>
        <span><i class="dot" style="--c:var(--p-me)"></i>Mato</span>
        <span><i class="dot" style="--c:var(--p-wife)"></i>Manželka</span>
        <span><i class="dot" style="--c:var(--p-fam)"></i>Spoločné</span>
      </div>
    </div>
    <div class="grid-wrap">
      <div class="wk"><div>Po</div><div>Ut</div><div>St</div><div>Št</div><div>Pi</div><div>So</div><div>Ne</div></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section class="panel day" aria-label="Udalosti dňa">
    <div class="dayhead"><h2 id="dayTitle">Dnes</h2></div>
    <div class="evrow" id="evrow"></div>
  </section>

  <aside class="panel todo" aria-label="To-do list">
    <h2>To-do</h2>
    <div class="tabs"><span class="on">Všetko</span><span>Mato</span><span>Manželka</span><span>Spoločné</span></div>
    <ul class="tasks" id="tasks"></ul>
    <form class="addrow" id="addForm">
      <input id="newTask" type="text" placeholder="Pridať úlohu" aria-label="Nová úloha">
      <button type="submit">Pridať</button>
    </form>
    <div class="foot">
      <span class="note">Ukážkové dáta. Slideshow sa spustí po <span id="idleS">45</span> s nečinnosti.</span>
      <button class="ss" id="ssBtn" type="button">Slideshow</button>
    </div>
  </aside>
</div>

<div class="show" id="show" hidden>
  <div class="cap">Ukážkové „fotky“ · dotykom späť na kalendár</div>
  <div class="ssmonth" id="ssMonth"></div>
  <div class="ov">
    <div class="bigclock tnum" id="ssClock"></div>
    <div class="pill" id="ssNext"></div>
  </div>
</div>

<script>
(function () {
  const C = { work: 'var(--p-work)', me: 'var(--p-me)', wife: 'var(--p-wife)', fam: 'var(--p-fam)' };
  const WHO = { work: 'Mato práca', me: 'Mato', wife: 'Manželka', fam: 'Spoločné' };
  const IDLE_S = 45;
  const $ = id => document.getElementById(id);
  const hm = d => d.toLocaleTimeString('sk-SK', { hour: '2-digit', minute: '2-digit' });
  const key = d => d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
  const sameDay = (a, b) => key(a) === key(b);

  const now0 = new Date();
  const today = new Date(now0.getFullYear(), now0.getMonth(), now0.getDate());

  // Today's example events, placed relative to now so the countdown always shows something
  const base = new Date(now0); base.setMinutes(Math.round(now0.getMinutes() / 15) * 15, 0, 0);
  const at = m => new Date(base.getTime() + m * 60000);
  const todays = [
    { s: at(-240), d: 60, t: 'Plánovanie šprintu', p: 'work' },
    { s: at(-150), d: 75, t: 'Joga', p: 'wife' },
    { s: at(-45), d: 60, t: 'Obsadené', p: 'work', busy: true },
    { s: at(25), d: 45, t: 'Zubár – Ema', p: 'fam', imp: true, where: 'Hlavná 12' },
    { s: at(120), d: 30, t: 'Vyzdvihnúť balík', p: 'wife' },
    { s: at(195), d: 60, t: 'Tréning – futbal', p: 'me' },
    { s: at(300), d: 120, t: 'Večera u babky', p: 'fam', imp: true }
  ].filter(e => sameDay(e.s, today));
  todays.unshift({ allDay: true, t: 'Vývoz plastov', p: 'fam', imp: true, s: today });

  // Example events for other days, by offset from today: [offset, "HH:MM" or null for all-day, title, person, important]
  const other = [
    [-9, '18:00', 'Kino', 'fam'], [-7, '09:00', 'Obsadené', 'work'], [-6, '17:30', 'Plávanie', 'me'], [-5, null, 'Narodeniny – Peťo', 'fam', 1],
    [-3, '10:00', 'Obsadené', 'work'], [-2, '19:00', 'Kaderníčka', 'wife'], [-1, '16:00', 'Nákup IKEA', 'fam'],
    [1, '09:00', 'Obsadené', 'work'], [1, '17:00', 'Rodičovské združenie', 'fam', 1], [2, '18:30', 'Kaderníčka', 'wife'],
    [3, null, 'Výlet Tatry', 'fam'], [3, '07:00', 'Odchod', 'me'], [5, '13:00', 'Obsadené', 'work'], [5, '19:00', 'Kino', 'fam'],
    [6, '08:00', 'Servis auta', 'me', 1], [8, '10:00', 'Obsadené', 'work'], [8, '14:00', 'Obsadené', 'work'], [8, '18:00', 'Joga', 'wife'],
    [10, null, 'Mama: meniny', 'wife'], [12, '09:30', 'Pediatrička – Ema', 'fam', 1], [13, '11:00', 'Obsadené', 'work'], [15, '20:00', 'Koncert', 'fam'],
    [-12, '19:00', 'Joga', 'wife'], [-14, '10:00', 'Obsadené', 'work'], [17, '18:00', 'Tréning – futbal', 'me'], [19, null, 'Dovolenka začína', 'fam', 1]
  ];
  const byDay = {};
  const add = e => { (byDay[key(e.s)] = byDay[key(e.s)] || []).push(e); };
  todays.forEach(add);
  other.forEach(([off, time, t, p, imp]) => {
    const s = new Date(today); s.setDate(s.getDate() + off);
    if (time) { const [h, m] = time.split(':'); s.setHours(+h, +m); }
    add({ s, d: 60, t, p, imp: !!imp, allDay: !time, busy: t === 'Obsadené' });
  });
  Object.values(byDay).forEach(list => list.sort((a, b) => (b.allDay - a.allDay) || (a.s - b.s)));

  // Current week (Monday first)
  const start = new Date(today); start.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  const wEnd = new Date(start); wEnd.setDate(start.getDate() + 6);
  $('month').textContent = 'Týždeň ' + start.getDate() + '.' + (start.getMonth() !== wEnd.getMonth() ? ' ' + (start.getMonth() + 1) + '.' : '') + ' – ' + wEnd.toLocaleDateString('sk-SK', { day: 'numeric', month: 'long' });
  let selected = today;
  const cells = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'cell';
    if (d < today) b.classList.add('out');
    if (i % 7 >= 5) b.classList.add('we');
    if (sameDay(d, today)) b.classList.add('today');
    const evs = byDay[key(d)] || [];
    const vis = sameDay(d, today) ? evs.filter(e => e.allDay || new Date(e.s.getTime() + e.d * 60000) > now0) : evs;
    const shown = vis.slice(0, 8);
    b.innerHTML = '<span class="n tnum">' + d.getDate() + '</span>' +
      shown.map(e => '<span class="ln' + (e.imp ? ' imp' : '') + '" style="--c:' + C[e.p] + '">' + (e.allDay ? '' : hm(e.s) + ' ') + (e.imp ? '! ' : '') + e.t + '</span>').join('') +
      (vis.length > 8 ? '<span class="more">+' + (vis.length - 8) + ' ďalšie</span>' : '');
    b.setAttribute('aria-label', d.toLocaleDateString('sk-SK', { weekday: 'long', day: 'numeric', month: 'long' }) + ', ' + evs.length + ' udalostí');
    b.addEventListener('click', () => { selected = d; renderDay(); });
    cells.push([b, d]); $('grid').appendChild(b);
  }

  function renderDay() {
    cells.forEach(([b, d]) => b.classList.toggle('sel', sameDay(d, selected)));
    const isToday = sameDay(selected, today);
    $('dayTitle').textContent = isToday ? 'Dnes' : selected.toLocaleDateString('sk-SK', { weekday: 'long', day: 'numeric', month: 'long' });
    const n = new Date();
    const evs = byDay[key(selected)] || [];
    const nx = isToday ? evs.find(e => !e.allDay && !e.busy && new Date(e.s.getTime() + e.d * 60000) > n) : null;
    $('evrow').innerHTML = evs.length ? evs.map(e => {
      const end = new Date(e.s.getTime() + e.d * 60000);
      const past = isToday && !e.allDay && end < n;
      return '<div class="ev' + (past ? ' past' : '') + (e === nx ? ' nextup' : '') + '" style="--c:' + C[e.p] + '">' +
        (e === nx ? '<span class="badge">Najbližšie</span>' : '') +
        '<div class="tm tnum">' + (e.allDay ? 'Celý deň' : hm(e.s) + '–' + hm(end)) + '</div>' +
        '<div class="tt">' + (e.imp ? '! ' : '') + e.t + '</div><div class="who">' + WHO[e.p] + (e.where ? ' · ' + e.where : '') + '</div></div>';
    }).join('') : '<div class="empty">Žiadne udalosti</div>';
    const focus = $('evrow').querySelector('.nextup');
    $('evrow').scrollLeft = focus ? focus.offsetLeft - $('evrow').firstElementChild.offsetLeft : 0;
  }

  // To-do
  const tasks = [
    { t: 'Zaplatiť škôlku', who: 'Spoločné', due: true },
    { t: 'Vyložiť kontajner na plasty', who: 'Mato', due: true },
    { t: 'Kúpiť mlieko a chlieb', who: 'Manželka' },
    { t: 'Objednať servis auta', who: 'Mato' },
    { t: 'Darček pre Peťa', who: 'Spoločné' },
    { t: 'Zavolať opravára práčky', who: 'Mato', done: true }
  ];
  let tid = 0;
  function addTask(t) {
    const li = document.createElement('li'); const id = 'task' + (tid++);
    li.innerHTML = '<label for="' + id + '"><input type="checkbox" id="' + id + '"' + (t.done ? ' checked' : '') + '><span class="t"></span></label>';
    const span = li.querySelector('.t');
    span.textContent = t.t;
    if (t.due) span.insertAdjacentHTML('beforeend', '<span class="due">dnes</span>');
    span.insertAdjacentHTML('beforeend', '<span class="who"></span>');
    span.querySelector('.who').textContent = t.who;
    $('tasks').appendChild(li);
  }
  tasks.forEach(addTask);
  $('addForm').addEventListener('submit', e => {
    e.preventDefault(); const v = $('newTask').value.trim(); if (!v) return;
    addTask({ t: v, who: 'Spoločné' }); $('newTask').value = '';
  });

  function fmtIn(min) {
    if (min < 1) return 'Teraz';
    if (min < 60) return 'o ' + min + ' min';
    const h = Math.floor(min / 60), m = min % 60;
    return 'o ' + h + ' h' + (m ? ' ' + m + ' min' : '');
  }

  function tick() {
    const n = new Date();
    $('clock').textContent = hm(n); $('ssClock').textContent = hm(n);
    $('date').textContent = n.toLocaleDateString('sk-SK', { weekday: 'long', day: 'numeric', month: 'long' });
    const nx = todays.find(e => !e.allDay && !e.busy && new Date(e.s.getTime() + e.d * 60000) > n);
    if (nx) {
      const min = Math.max(0, Math.round((nx.s - n) / 60000));
      const c = nx.s <= n ? 'Teraz' : fmtIn(min);
      $('nextCount').textContent = c; $('nextWhat').textContent = nx.t;
      $('nextMeta').textContent = hm(nx.s) + ' · ' + WHO[nx.p] + (nx.where ? ' · ' + nx.where : '');
      $('ssNext').textContent = c.charAt(0).toUpperCase() + c.slice(1) + ': ' + nx.t;
    } else {
      $('nextCount').textContent = 'Dnes už nič'; $('nextWhat').textContent = 'Pekný večer'; $('nextMeta').textContent = '';
      $('ssNext').textContent = 'Dnes už nič v kalendári';
    }
    if (sameDay(selected, today)) renderDay();
  }
  renderDay(); tick(); setInterval(tick, 15000);

  // Slideshow with generated example "photos"
  const scenes = [
    'radial-gradient(circle at 70% 30%, #ffd9a0 0 8%, transparent 9%), linear-gradient(#f6a96b, #d9667a 45%, #3b3557 46%, #1f2440)',
    'radial-gradient(ellipse at 30% 110%, #2f6b3f 0 40%, transparent 41%), radial-gradient(ellipse at 80% 115%, #24532f 0 45%, transparent 46%), linear-gradient(#9cc9e8, #e6f1f7 60%, #6f9b6e 61%)',
    'linear-gradient(160deg, transparent 55%, #e9eef2 55% 70%, transparent 70%), linear-gradient(#5d7fa8, #a9c1d9 50%, #2f5a7c 51%, #18344d)',
    'radial-gradient(circle at 25% 25%, #fff3c4 0 6%, transparent 7%), linear-gradient(135deg, #e8b44c, #c4573a 60%, #6b2a3a)'
  ];
  const show = $('show');
  const slides = scenes.map(bg => { const s = document.createElement('div'); s.className = 'slide'; s.style.backgroundImage = bg; show.insertBefore(s, show.firstChild); return s; });
  let si = 0, sTimer = null, idleTimer = null;
  function next() { slides.forEach(s => s.classList.remove('on')); void slides[si].offsetWidth; slides[si].classList.add('on'); si = (si + 1) % slides.length; }
  (function buildSsMonth() {
    const f = new Date(today.getFullYear(), today.getMonth(), 1);
    const s = new Date(f); s.setDate(1 - ((f.getDay() + 6) % 7));
    const lastD = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    const weeks = Math.ceil((((f.getDay() + 6) % 7) + lastD.getDate()) / 7);
    let h = '<div class="mt">' + today.toLocaleDateString('sk-SK', { month: 'long', year: 'numeric' }) + '</div><div class="mg">' +
      ['Po', 'Ut', 'St', 'Št', 'Pi', 'So', 'Ne'].map(x => '<span class="h">' + x + '</span>').join('');
    for (let i = 0; i < weeks * 7; i++) {
      const d = new Date(s); d.setDate(s.getDate() + i);
      const cls = [d.getMonth() !== today.getMonth() ? 'o' : '', sameDay(d, today) ? 'td' : '', byDay[key(d)] ? 'has' : ''].join(' ').trim();
      h += '<span class="' + cls + '">' + d.getDate() + '</span>';
    }
    $('ssMonth').innerHTML = h + '</div>';
  })();
  function startShow() { show.hidden = false; next(); sTimer = setInterval(next, 8000); }
  function stopShow() { show.hidden = true; clearInterval(sTimer); armIdle(); }
  function armIdle() { clearTimeout(idleTimer); if (show.hidden) idleTimer = setTimeout(startShow, IDLE_S * 1000); }
  $('idleS').textContent = IDLE_S;
  $('ssBtn').addEventListener('click', e => { e.stopPropagation(); clearTimeout(idleTimer); startShow(); });
  show.addEventListener('click', stopShow);
  $('fsBtn') && $('fsBtn').addEventListener('click', () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); }
    } catch (e) {}
  });
  document.addEventListener('fullscreenchange', () => { $('fsBtn') && ($('fsBtn').textContent = document.fullscreenElement ? 'Ukončiť celú obrazovku' : 'Celá obrazovka'); });
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { if (show.hidden) armIdle(); }, { passive: true }));
  armIdle();
})();
</script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
async function keepAwake() { try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {} }
keepAwake(); document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });
</script>
</body></html>
